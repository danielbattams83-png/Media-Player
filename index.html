<!doctype html>
<html lang="en">
  <head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Windows Media Player Pro</title>
    <meta name="description" content="High-fidelity Windows Media Player with Web Audio DSP, lossless audio explorer, 5-band equalizer, and real-time spectrum visualizer." />
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    
    <!-- Windows & Browser Theming -->
    <meta name="theme-color" content="#09090b" />
    <meta name="msapplication-TileColor" content="#09090b" />
    <meta name="msapplication-navbutton-color" content="#09090b" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Windows Media Player" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="Windows Media Player Pro" />
    <meta property="og:description" content="Lossless Audio Engine, Web Audio 5-Band DSP, and Real-Time Spectrum Visualizer" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration for Native Windows PWA Installation -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((registration) => {
              console.log('Windows Media Player PWA ServiceWorker active:', registration.scope);
            })
            .catch((error) => {
              console.warn('PWA ServiceWorker registration notice:', error);
            });
        });
      }
    </script>
  </body>
</html>
